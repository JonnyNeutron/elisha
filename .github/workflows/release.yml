name: build-windows-exe
on:
  push:
    branches: [main]
    paths: ["elisha.py", "requirements.txt", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Elisha.exe
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name Elisha \
            --collect-all meshtastic --collect-all meshcore --collect-all meshcore_cli --collect-all esptool \
            --collect-submodules serial \
            --hidden-import meshtastic.__main__ --hidden-import meshcore_cli.__main__ --hidden-import esptool.__main__ \
            --copy-metadata meshtastic --copy-metadata meshcore-cli --copy-metadata esptool --copy-metadata pyserial \
            elisha.py
      - name: Smoke test the bundled tools
        shell: bash
        run: |
          ./dist/Elisha.exe -m meshtastic --version
          ./dist/Elisha.exe -m esptool version
          ./dist/Elisha.exe -m meshcore_cli -v
      - uses: actions/upload-artifact@v4
        with:
          name: Elisha-windows
          path: dist/Elisha.exe
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Elisha (latest build)' }}
          target_commitish: ${{ github.sha }}
          body: Download Elisha.exe below and double click it. No Python or install needed. Windows may warn that the file is unsigned. Click More info, then Run anyway.
          files: dist/Elisha.exe
          make_latest: true
