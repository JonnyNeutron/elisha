[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elisha"
version = "0.1.0"
description = "Elisha: free, offline, local GUI for programming Meshtastic and MeshCore radios"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["meshtastic", "meshcore-cli", "esptool>=5"]
keywords = ["meshtastic", "meshcore", "lora", "mesh", "offline", "esp32", "nrf52"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
]

[project.scripts]
elisha = "elisha:main"

[tool.setuptools]
py-modules = ["elisha"]
